[package]
name = "phuse-planner"
version = "0.1.0"
edition = "2021"
description = "Personal itinerary planner for PHUSE EU Connect 2026"

[dependencies]
anyhow = "1"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
